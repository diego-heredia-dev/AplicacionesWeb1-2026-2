upstream flask_app {
    server flask:5000;
}

upstream django_app {
    server django:8000;
}

server {
    listen 80;
    server_name carta.twilightparadox.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name admin.django.twilightparadox.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;

    server_name carta.twilightparadox.com;

    ssl_certificate /etc/letsencrypt/live/lacarta/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lacarta/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 10M;

    location /static/ {
        alias /app/app/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl;
    http2 on;

    server_name admin.django.twilightparadox.com;

    ssl_certificate /etc/letsencrypt/live/lacarta/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lacarta/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 10M;

    location /django-static/ {
        alias /app/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}