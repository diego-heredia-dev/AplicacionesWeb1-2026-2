{% extends 'layout.html' %}

{% block title %}Editar plato - La Carta{% endblock %}

{% block content %}

<h1>Editar plato</h1>

<form method="POST">

    <label for="nombre">Nombre:</label>
    <input
        type="text"
        id="nombre"
        name="nombre"
        value="{{ plato.nombre }}"
        required
    >

    <label for="precio">Precio:</label>
    <input
        type="number"
        id="precio"
        name="precio"
        step="0.01"
        min="0.01"
        value="{{ plato.precio }}"
        required
    >

    <label>
        Disponible:
        <input
            type="checkbox"
            name="disponible"
            {% if plato.disponible %}checked{% endif %}
        >
    </label>

    <button type="submit">Guardar cambios</button>

</form>

<a href="{{ url_for('lacarta.detalle_restaurante', restaurante_id=plato.restaurante_id) }}">
    Cancelar
</a>

{% endblock %}
