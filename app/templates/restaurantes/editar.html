{% extends 'layout.html' %}

{% block title %}Editar restaurante - La Carta{% endblock %}

{% block content %}
<h1>Editar restaurante</h1>

<form method="POST" action="{{url_for('editar_restaurante', restaurante_id=restaurante.id)}}">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" value="{{restaurante.nombre}}" required>

    <label for="ciudad">Ciudad:</label>
    <input type="text" id="ciudad" name="ciudad" value="{{restaurante.ciudad}}" required>

    <label for="direccion">Direccion:</label>
    <input type="text" id="direccion" name="direccion" value="{{restaurante.direccion or ''}}">

    <label for="telefono">Telefono:</label>
    <input type="tel" id="telefono" name="telefono" value="{{restaurante.telefono or ''}}">

    <button type="submit">Guardar cambios</button>
</form>

<a href="{{url_for('detalle_restaurante', restaurante_id=restaurante.id)}}">Cancelar</a>
{% endblock %}
