# Define un grupo de servidores al que Nginx puede reenviar peticiones.
# Se llama "flask_app" (nombre libre).


# Define un sitio (servidor virtual) que atiende peticiones
server {
    # Nginx escucha en el puerto 80 (HTTP)
    listen 80;

    server_name elestanque.chickenkiller.com
                www.elestanque.chickenkiller.com;

    # Oculta la versión de Nginx en los errores y cabeceras (más seguro)
    server_tokens off;

    # Tamaño máximo de lo que un usuario puede subir (ej. imágenes): 10 MB
    client_max_body_size 10M;

    # Permitir la validación del dominio por Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    #Redirige a https
    location / {
        return 301 https://$host$request_uri;
    }    
}

# HTTPS
server {
    listen 443 ssl;
    server_name elestanque.chickenkiller.com 
                www.elestanque.chickenkiller.com;

    server_tokens off;
    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/elestanque.chickenkiller.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elestanque.chickenkiller.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Reglas para las URLs que empiezan con /static/ (CSS, JS, imágenes)
    location /static/ {
        # Nginx sirve estos archivos directamente desde esta carpeta,
        # sin molestar a Flask (es más rápido)
        alias /app/app/static/;

        # El navegador puede guardar estos archivos 30 días sin volver a pedirlos
        expires 30d;

        # No registra estas peticiones en el log (evita ruido)
        access_log off;

        # Permite que cualquier caché (navegador, CDN) guarde los archivos
        add_header Cache-Control "public";
    }

    # Reglas para todo lo demás (páginas, API, etc.)
    location / {
        # Reenvía la petición al grupo "flask_app" (o sea, a Gunicorn)
        proxy_pass http://web:8000;

        # Le pasa a Flask el dominio original que escribió el usuario
        proxy_set_header Host $host;

        # Le pasa la IP real del usuario (si no, Flask vería la IP de Nginx)
        proxy_set_header X-Real-IP $remote_addr;

        # Lista de IPs por las que pasó la petición (usuario y proxies)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Le dice a Flask si el usuario entró por http o https
        proxy_set_header X-Forwarded-Proto $scheme;

        # No modifica las redirecciones que devuelva Flask
        proxy_redirect off;

        # Máximo 30 segundos para conectarse con Flask
        proxy_connect_timeout 30s;

        # Máximo 30 segundos para enviarle datos a Flask
        proxy_send_timeout 30s;

        # Máximo 30 segundos esperando la respuesta de Flask
        proxy_read_timeout 30s;
    }
}