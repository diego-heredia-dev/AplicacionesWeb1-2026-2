services:
  web:
    build: .
    restart: always
    #Se tiene env_file y environment por que para produccio
    #Si no hay una variable en env_file entonces no arracamos
    #Y eso se declara en environment
    #En SECRET_KEY:?SECRET_KEY is required
    env_file: 
      - .env.prod
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: postgresql://restaurant_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/restaurant_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_files:/app/app/static
    networks:
      - backend
      - frontend
    
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: restaurant_db
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - restaurant_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_user -d restaurant_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/app/static:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - frontend
  
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done;"

volumes:
  restaurant_data:
  static_files:
  certbot_conf:
  certbot_www:

#frontend conecta web/flask/gunicorn con nginx
#backend conecta web/flask/gunicorn con db/postgreSQL
networks:
  frontend:
  backend:
    internal: true