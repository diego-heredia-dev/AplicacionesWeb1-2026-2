{% extends "base.html" %}

{% block title %}Editar plato{% endblock %}

{% block content %}

<h1>Editar plato</h1>

{% with mensajes = get_flashed_messages(with_categories=true) %}
    {% for categoria, mensaje in mensajes %}
        <p class="mensaje">{{ mensaje }}</p>
    {% endfor %}
{% endwith %}

<form method="POST">

    <label for="name">Nombre:</label>
    <input
        type="text"
        id="name"
        name="name"
        maxlength="150"
        value="{{ plato.name }}"
        required
    >

    <label for="description">Descripción:</label>
    <textarea
        id="description"
        name="description"
    >{{ plato.description or '' }}</textarea>

    <label for="price">Precio:</label>
    <input
        type="number"
        id="price"
        name="price"
        min="0.01"
        step="0.01"
        value="{{ plato.price }}"
        required
    >

    <label for="category_id">Categoría:</label>
    <select id="category_id" name="category_id" required>

        {% for categoria in categorias %}
            <option
                value="{{ categoria.category_id }}"
                {% if categoria.category_id == plato.category_id %}selected{% endif %}
            >
                {{ categoria.name }}
            </option>
        {% endfor %}

    </select>

    <br><br>

    <button type="submit">Actualizar plato</button>

</form>

<br>

<a href="{{ url_for('main.listar_platos') }}">Cancelar</a>

{% endblock %}
