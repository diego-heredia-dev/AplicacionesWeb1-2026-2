services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todoapp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todoapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: postgresql://todo:todo@db:5432/todoapp
      SECRET_KEY: dev-secret-change-me
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data: