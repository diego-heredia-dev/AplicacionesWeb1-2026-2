services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todoapp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todoapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://todo:todo@db:5432/todoapp
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    volumes:
      - static-data:/static

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    depends_on:
      - web
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static-data:/static:ro
    networks:
      - frontend

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres-data:
  static-data: