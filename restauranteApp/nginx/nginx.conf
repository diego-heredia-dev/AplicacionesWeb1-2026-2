upstream flask_app {
    server flask:5000;
}

upstream django_app {
    server django:8000;
}

server {
    listen 80;
    server_name carta.twilightparadox.com admin.dh.django.twilightparadox.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name carta.twilightparadox.com;

    ssl_certificate /etc/letsencrypt/live/carta.twilightparadox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carta.twilightparadox.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name admin.dh.django.twilightparadox.com;

    ssl_certificate /etc/letsencrypt/live/carta.twilightparadox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carta.twilightparadox.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location /static/ {
        alias /static/;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
